# Example Frigate config used by the tests. Camera names are made up.
mqtt:
  enabled: false

ffmpeg:
  hwaccel_args: preset-nvidia   # decode on the GPU

detect:
  fps: 5

go2rtc:
  streams:
    front_door_sub:
      - rtsp://{FRIGATE_CAM_USER}:{FRIGATE_CAM_PASS}@192.0.2.10:554/sub
    driveway_sub:
      - rtsp://192.0.2.11:554/sub

cameras:
  front_door:
    ffmpeg:
      inputs:
        # main stream for recordings
        - path: rtsp://127.0.0.1:8554/front_door
          input_args: preset-rtsp-restream
          roles:
            - record
        # substream for detection
        - path: rtsp://127.0.0.1:8554/front_door_sub   # 640x360
          input_args: preset-rtsp-restream
          roles:
            - detect
    detect:
      width: 640
      height: 360
    record:
      enabled: true

  driveway:
    ffmpeg:
      output_args:
        record: preset-record-generic-audio-aac
      inputs:
        - path: rtsp://127.0.0.1:8554/driveway
          roles: [record]
        - path: rtsp://127.0.0.1:8554/driveway_sub
          hwaccel_args: preset-nvidia
          roles: [detect]
    detect:
      width: 640
      height: 480
      fps: 3

  side_gate:
      ffmpeg:
          output_args:
              detect: -threads 1 -f rawvideo -pix_fmt yuv420p
          inputs:
              -   path: rtsp://{FRIGATE_CAM_USER}:{FRIGATE_CAM_PASS}@192.0.2.12:554/h264Preview_01_sub
                  roles:
                      - detect
      detect:
          width: 896
          height: 512

  backyard:
    ffmpeg:
      inputs:
        - path: rtsp://127.0.0.1:8554/backyard
          roles:
            - detect
            - record
    detect:
      width: 1280
      height: 720

  garage:
    ffmpeg:
      hwaccel_args: ""
      inputs:
        - path: rtsp://127.0.0.1:8554/garage_sub
          roles:
            - detect
    detect:
      width: 640
      height: 360

  porch:
    ffmpeg:
      inputs:
        - path: rtsp://127.0.0.1:8554/porch_sub
          roles:
            - detect
